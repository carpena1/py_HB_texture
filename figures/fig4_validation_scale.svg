<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-label="Exact-class accuracy on the same 1,680 test soils. A new site whose laboratory is in the reference: 39.7 percent from the curve alone, 45.5 percent with depth and bulk density. An unseen laboratory: 29.3 and 31.9 percent. Chance is 8.3 percent; the Cover and Hart ceiling for the curve alone is 54 and 44 percent.">
      <text x="16" y="26" font-size="11" font-family="IBM Plex Mono, monospace" letter-spacing="1.4" fill="#5C6A70">EXACT TEXTURE CLASS, 12 USDA CLASSES</text>
      <g font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#141A1D">
        <rect x="640" y="15" width="14" height="12" fill="#141A1D" opacity=".28"/>
        <text x="660" y="26">curve alone</text>
        <rect x="760" y="15" width="14" height="12" fill="#0E6E73" opacity=".85"/>
        <text x="780" y="26">+ depth and bulk density</text>
      </g>
      <g font-family="IBM Plex Sans, sans-serif">
        <text x="60" y="60" font-size="12.5" font-weight="600" fill="#141A1D">New site, its laboratory already in the reference</text>
        <text x="60" y="160" font-size="12.5" font-weight="600" fill="#0E6E73">Unseen laboratory</text>
        <text x="198" y="160" font-size="11" fill="#5C6A70">its whole contributing source held out</text>
        <rect x="60" y="68" width="611.4" height="20" fill="#141A1D" opacity=".28"/>
        <text x="679.4" y="83" font-size="13" fill="#141A1D">39.7 %</text>
        <rect x="60" y="92" width="700.7" height="20" fill="#0E6E73" opacity=".85"/>
        <text x="768.7" y="107" font-size="13" font-weight="600" fill="#141A1D">45.5 %</text>
        <rect x="60" y="168" width="451.2" height="20" fill="#141A1D" opacity=".28"/>
        <text x="519.2" y="183" font-size="13" fill="#141A1D">29.3 %</text>
        <rect x="60" y="192" width="491.3" height="20" fill="#0E6E73" opacity=".85"/>
        <text x="559.3" y="207" font-size="13" font-weight="600" fill="#141A1D">31.9 %</text>
        <line x1="887.0" y1="64" x2="887.0" y2="116" stroke="#141A1D" opacity=".55" stroke-dasharray="3 3"/>
        <text x="893.0" y="94" font-size="11" fill="#5C6A70">ceiling 54 %</text>
        <line x1="733.0" y1="164" x2="733.0" y2="216" stroke="#141A1D" opacity=".55" stroke-dasharray="3 3"/>
        <text x="739.0" y="194" font-size="11" fill="#5C6A70">ceiling 44 %</text>
        <line x1="187.8" y1="64" x2="187.8" y2="120" stroke="#141A1D" opacity=".4" stroke-dasharray="2 4"/>
        <line x1="187.8" y1="166" x2="187.8" y2="226" stroke="#141A1D" opacity=".4" stroke-dasharray="2 4"/>
        <text x="187.8" y="262" font-size="11" text-anchor="middle" fill="#5C6A70">chance 8.3 %</text>
      </g>
      <!-- axis -->
      <line x1="60" y1="226" x2="984" y2="226" stroke="#141A1D" opacity=".35"/>
      <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C6A70" text-anchor="middle">
        <text x="60" y="244">0 %</text>
        <text x="368" y="244">20 %</text>
        <text x="676" y="244">40 %</text>
        <text x="984" y="244">60 %</text>
      </g>
      <g font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#141A1D">
        <text x="60" y="290">Holding out the laboratory costs 10.4 points from the curve alone and 13.6 with depth and bulk density:</text>
        <text x="60" y="306">those inputs help far more once the laboratory's own soils are in the reference.</text>
        <text x="60" y="330" font-size="11" fill="#5C6A70">Dashed: the Cover &amp; Hart ceiling for the curve's four van Genuchten parameters. With depth and bulk density as inputs the bound differs and is not computed.</text>
      </g>
    </svg>
