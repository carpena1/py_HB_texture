<?xml version="1.0" encoding="UTF-8"?>
<!-- py_HB_texture reference build. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="676" viewBox="0 0 1040 676" role="img" aria-label="Six source databases pass through per-source preparation scripts into derivative CSV tables; GSHP, KSSL, Hohenbrink and the restricted EU-HYDI form the default merged reference of 19,883 layers, with UNSODA and sDB added only in the all set.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#141A1D"/>
        </marker>
        <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#0E6E73"/>
        </marker>
      </defs>

      <g font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="#5C6A70">
        <text x="16" y="22">RAW SOURCE</text>
        <text x="256" y="22">PREPARATION</text>
        <text x="596" y="22">DERIVATIVE TABLE</text>
        <text x="848" y="22">REFERENCE SET</text>
      </g>
      <line x1="16" y1="32" x2="1024" y2="32" stroke="#141A1D" opacity=".18"/>

      <g font-family="IBM Plex Sans, sans-serif">
        <!-- GSHP -->
        <rect x="16" y="48" width="184" height="78" rx="3" fill="none" stroke="#141A1D" opacity=".85"/>
        <text x="28" y="70" font-size="13" font-weight="600" fill="#141A1D">GSHP</text>
        <text x="28" y="88" font-size="11" fill="#5C6A70">Gupta et al. 2022</text>
        <text x="28" y="104" font-size="11" fill="#5C6A70">15,259 layers</text>
        <text x="28" y="118" font-size="11" fill="#5C6A70">params + raw points</text>
        <rect x="256" y="48" width="300" height="78" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".85"/>
        <text x="268" y="68" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#0E6E73">prepare_gshp.py</text>
        <text x="268" y="86" font-size="11" fill="#141A1D">keep &#8220;good quality estimate&#8221;, valid class,</text>
        <text x="268" y="101" font-size="11" fill="#141A1D">fractions summing 95&#8211;105 %</text>
        <text x="268" y="118" font-size="11" fill="#141A1D">&#945; m&#8315;&#185; &#8594; kPa&#8315;&#185;   &#183;   K<tspan baseline-shift="sub" font-size="8">s</tspan> cm/d &#8594; cm/h</text>

        <!-- KSSL -->
        <rect x="16" y="142" width="184" height="78" rx="3" fill="none" stroke="#141A1D" opacity=".85"/>
        <text x="28" y="164" font-size="13" font-weight="600" fill="#141A1D">NCSS / KSSL</text>
        <text x="28" y="182" font-size="11" fill="#5C6A70">USDA&#8211;NRCS, 5.4 GB</text>
        <text x="28" y="198" font-size="11" fill="#5C6A70">~420,000 layers</text>
        <text x="28" y="212" font-size="11" fill="#5C6A70">gravimetric %, no K<tspan baseline-shift="sub" font-size="8">s</tspan></text>
        <rect x="256" y="142" width="300" height="78" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".85"/>
        <text x="268" y="162" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#0E6E73">prepare_kssl.py</text>
        <text x="268" y="180" font-size="11" fill="#141A1D">need &#8805;5 tensions + particle-size analysis</text>
        <text x="268" y="195" font-size="11" fill="#141A1D">w% &#215; bulk density &#8594; volumetric &#952;</text>
        <text x="268" y="212" font-size="11" fill="#0E6E73">add saturation anchor &#952;(0) = 0.95 &#215; porosity</text>

        <!-- Hohenbrink -->
        <rect x="16" y="236" width="184" height="78" rx="3" fill="none" stroke="#141A1D" opacity=".85"/>
        <text x="28" y="258" font-size="13" font-weight="600" fill="#141A1D">Hohenbrink</text>
        <text x="28" y="276" font-size="11" fill="#5C6A70">et al. 2023, ESSD</text>
        <text x="28" y="292" font-size="11" fill="#5C6A70">572 German cores</text>
        <text x="28" y="306" font-size="11" fill="#5C6A70">HYPROP + WP4 + KSAT</text>
        <rect x="256" y="236" width="300" height="78" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".85"/>
        <text x="268" y="256" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#0E6E73">prepare_hohenbrink.py</text>
        <text x="268" y="274" font-size="11" fill="#141A1D">pF &#8594; kPa   &#183;   k cm/d &#8594; cm/h</text>
        <text x="268" y="291" font-size="11" fill="#0E6E73">bin in pF, one median point per bin</text>
        <text x="268" y="306" font-size="11" fill="#5C6A70">(else 199 wet points outvote 3 dry ones)</text>

        <!-- EU-HYDI -->
        <rect x="16" y="330" width="184" height="78" rx="3" fill="none" stroke="#141A1D" opacity=".85"/>
        <text x="28" y="352" font-size="13" font-weight="600" fill="#141A1D">EU-HYDI</text>
        <text x="28" y="370" font-size="11" fill="#5C6A70">Weynants et al. 2013</text>
        <text x="28" y="386" font-size="11" fill="#5C6A70">18,682 samples, 18 countries</text>
        <text x="28" y="400" font-size="11" fill="#141A1D">consortium-restricted</text>
        <rect x="256" y="330" width="300" height="78" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".85"/>
        <text x="268" y="350" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#0E6E73">prepare_euhydi.py</text>
        <text x="268" y="368" font-size="11" fill="#141A1D">need &#8805;5 reliable points + USDA fractions</text>
        <text x="268" y="383" font-size="11" fill="#141A1D">cm &#8594; kPa   &#183;   K at h = 0, saturated methods only</text>
        <text x="268" y="400" font-size="11" fill="#0E6E73">bin in pF; sum raw size classes where empty</text>

        <!-- UNSODA -->
        <rect x="16" y="424" width="184" height="58" rx="3" fill="none" stroke="#141A1D" opacity=".5"/>
        <text x="28" y="446" font-size="13" font-weight="600" fill="#141A1D" opacity=".75">UNSODA 2.0</text>
        <text x="28" y="464" font-size="11" fill="#5C6A70">790 soils</text>
        <rect x="256" y="424" width="300" height="58" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".5"/>
        <text x="268" y="444" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#5C6A70">prepare_unsoda.py</text>
        <text x="268" y="462" font-size="11" fill="#5C6A70">fit vG to measured points, cm &#8594; kPa</text>

        <!-- sDB -->
        <rect x="16" y="498" width="184" height="58" rx="3" fill="none" stroke="#141A1D" opacity=".5"/>
        <text x="28" y="520" font-size="13" font-weight="600" fill="#141A1D" opacity=".75">sDB (Belgium)</text>
        <text x="28" y="538" font-size="11" fill="#5C6A70">PANGAEA, CC-BY-3.0</text>
        <rect x="256" y="498" width="300" height="58" rx="3" fill="#EAEEEC" stroke="#141A1D" opacity=".5"/>
        <text x="268" y="518" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#5C6A70">prepare_sdb.py</text>
        <text x="268" y="536" font-size="11" fill="#5C6A70">fit vG to measured points</text>

        <!-- derivative tables -->
        <g font-size="11" font-family="IBM Plex Mono, monospace">
          <rect x="596" y="48" width="196" height="78" rx="3" fill="none" stroke="#0E6E73"/>
          <text x="608" y="72" fill="#0E6E73">gshp_reference</text>
          <text x="608" y="92" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#141A1D">9,996</text>
          <text x="608" y="112" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">6,644 with K<tspan baseline-shift="sub" font-size="8">s</tspan></text>

          <rect x="596" y="142" width="196" height="78" rx="3" fill="none" stroke="#0E6E73"/>
          <text x="608" y="166" fill="#0E6E73">kssl_reference</text>
          <text x="608" y="186" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#141A1D">2,530</text>
          <text x="608" y="206" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">0 with K<tspan baseline-shift="sub" font-size="8">s</tspan></text>

          <rect x="596" y="236" width="196" height="78" rx="3" fill="none" stroke="#0E6E73"/>
          <text x="608" y="260" fill="#0E6E73">hohenbrink_reference</text>
          <text x="608" y="280" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#141A1D">560</text>
          <text x="608" y="300" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">402 with K<tspan baseline-shift="sub" font-size="8">s</tspan></text>

          <rect x="596" y="330" width="196" height="78" rx="3" fill="none" stroke="#0E6E73"/>
          <text x="608" y="354" fill="#0E6E73">euhydi_reference</text>
          <text x="608" y="374" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#141A1D">6,797</text>
          <text x="608" y="394" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">2,704 with K<tspan baseline-shift="sub" font-size="8">s</tspan> &#183; not distributed</text>

          <rect x="596" y="424" width="196" height="58" rx="3" fill="none" stroke="#141A1D" opacity=".5"/>
          <text x="608" y="446" fill="#5C6A70">unsoda_reference</text>
          <text x="608" y="466" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#5C6A70">588</text>

          <rect x="596" y="498" width="196" height="58" rx="3" fill="none" stroke="#141A1D" opacity=".5"/>
          <text x="608" y="520" fill="#5C6A70">sdb_reference</text>
          <text x="608" y="540" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="#5C6A70">165</text>
        </g>

        <!-- reference sets -->
        <rect x="848" y="48" width="176" height="360" rx="3" fill="#D5E7E7" stroke="#0E6E73"/>
        <text x="862" y="72" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#0E6E73">merged</text>
        <text x="862" y="90" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#5C6A70">(default)</text>
        <text x="862" y="130" font-size="28" font-weight="600" fill="#141A1D">19,883</text>
        <text x="862" y="152" font-size="11" fill="#5C6A70">layers</text>
        <text x="862" y="182" font-size="11" fill="#141A1D">9,750 carry a measured</text>
        <text x="862" y="197" font-size="11" fill="#141A1D">saturated conductivity</text>
        <text x="862" y="226" font-size="11" fill="#5C6A70">7,740 European layers</text>
        <text x="862" y="241" font-size="11" fill="#5C6A70">(778 + 483 + 6,479)</text>
        <text x="862" y="270" font-size="11" fill="#5C6A70">12 USDA classes;</text>
        <text x="862" y="285" font-size="11" fill="#5C6A70">sand is 23 % of rows,</text>
        <text x="862" y="300" font-size="11" fill="#5C6A70">silt under 0.4 %</text>
        <text x="862" y="336" font-size="11" fill="#141A1D">Without the restricted</text>
        <text x="862" y="351" font-size="11" fill="#141A1D">EU-HYDI table, merged</text>
        <text x="862" y="366" font-size="11" fill="#141A1D">uses the public 13,086</text>
        <text x="862" y="381" font-size="11" fill="#5C6A70">(--reference public)</text>

        <rect x="848" y="424" width="176" height="132" rx="3" fill="none" stroke="#141A1D" opacity=".5"/>
        <text x="862" y="446" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#5C6A70">all</text>
        <text x="862" y="476" font-size="20" font-weight="600" fill="#5C6A70">20,636</text>
        <text x="862" y="500" font-size="11" fill="#5C6A70">adds UNSODA and sDB;</text>
        <text x="862" y="515" font-size="11" fill="#5C6A70">both largely duplicated</text>
        <text x="862" y="530" font-size="11" fill="#5C6A70">inside GSHP already,</text>
        <text x="862" y="545" font-size="11" fill="#5C6A70">so not in the default</text>
      </g>

      <g stroke="#141A1D" fill="none" opacity=".55">
        <line x1="200" y1="87"  x2="252" y2="87"  marker-end="url(#ar)"/>
        <line x1="200" y1="181" x2="252" y2="181" marker-end="url(#ar)"/>
        <line x1="200" y1="275" x2="252" y2="275" marker-end="url(#ar)"/>
        <line x1="200" y1="369" x2="252" y2="369" marker-end="url(#ar)"/>
        <line x1="200" y1="453" x2="252" y2="453" marker-end="url(#ar)" opacity=".6"/>
        <line x1="200" y1="527" x2="252" y2="527" marker-end="url(#ar)" opacity=".6"/>
      </g>
      <g stroke="#0E6E73" fill="none">
        <line x1="556" y1="87"  x2="592" y2="87"  marker-end="url(#ara)"/>
        <line x1="556" y1="181" x2="592" y2="181" marker-end="url(#ara)"/>
        <line x1="556" y1="275" x2="592" y2="275" marker-end="url(#ara)"/>
        <line x1="556" y1="369" x2="592" y2="369" marker-end="url(#ara)"/>
        <line x1="792" y1="87"  x2="844" y2="87"  marker-end="url(#ara)"/>
        <line x1="792" y1="181" x2="844" y2="181" marker-end="url(#ara)"/>
        <line x1="792" y1="275" x2="844" y2="275" marker-end="url(#ara)"/>
        <line x1="792" y1="369" x2="844" y2="369" marker-end="url(#ara)"/>
      </g>
      <g stroke="#141A1D" fill="none" opacity=".4">
        <line x1="556" y1="453" x2="592" y2="453" marker-end="url(#ar)"/>
        <line x1="556" y1="527" x2="592" y2="527" marker-end="url(#ar)"/>
        <line x1="792" y1="453" x2="844" y2="453" marker-end="url(#ar)"/>
        <line x1="792" y1="527" x2="844" y2="527" marker-end="url(#ar)"/>
      </g>

      <rect x="256" y="580" width="768" height="76" rx="3" fill="none" stroke="#141A1D" opacity=".35" stroke-dasharray="3 3"/>
      <text x="270" y="602" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="#141A1D" opacity=".8">free_m.py &#8212; shared by every preparation script</text>
      <text x="270" y="622" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">Also writes an unconstrained companion fit (&#952;r, &#952;s, &#945;, n, m) alongside the</text>
      <text x="270" y="639" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#5C6A70">Mualem one, refitting measured points where a source ships them.</text>
    </svg>
